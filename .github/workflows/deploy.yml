name: Deploy Production to VPS (Docker Hub)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Commit Hash, Branch, or Tag to deploy to Production'
        required: true
        default: 'main'
      deploy_mpxj:
        description: 'Build & Deploy MPXJ Service (Java)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-backend:
    name: Build & Push Backend (Cloud Runner)
    runs-on: ubuntu-latest
    outputs:
      image_backend: ${{ steps.meta.outputs.backend_image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Resolve Backend Image Tags
        id: meta
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME || 'aynuayex' }}"
          REPO="${DOCKER_USER}/cybersec-pmo"
          
          IMAGE_TAG="backend-${COMMIT_SHA}"
          BACKEND_IMMUTABLE="${REPO}:${IMAGE_TAG}"
          BACKEND_LATEST="${REPO}:backend"
          
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "backend_image=$BACKEND_IMMUTABLE" >> $GITHUB_OUTPUT
          echo "backend_tags=${BACKEND_IMMUTABLE},${BACKEND_LATEST}" >> $GITHUB_OUTPUT
          echo "Resolved Backend Tags: ${BACKEND_IMMUTABLE}, ${BACKEND_LATEST}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'aynuayex' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          pull: true
          no-cache: true
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & Push Frontend (Cloud Runner)
    runs-on: ubuntu-latest
    outputs:
      image_frontend: ${{ steps.meta.outputs.frontend_image }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Resolve Frontend Image Tags
        id: meta
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME || 'aynuayex' }}"
          REPO="${DOCKER_USER}/cybersec-pmo"
          
          IMAGE_TAG="frontend-${COMMIT_SHA}"
          FRONTEND_IMMUTABLE="${REPO}:${IMAGE_TAG}"
          FRONTEND_LATEST="${REPO}:frontend"
          
          echo "frontend_image=$FRONTEND_IMMUTABLE" >> $GITHUB_OUTPUT
          echo "frontend_tags=${FRONTEND_IMMUTABLE},${FRONTEND_LATEST}" >> $GITHUB_OUTPUT
          echo "Resolved Frontend Tags: ${FRONTEND_IMMUTABLE}, ${FRONTEND_LATEST}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'aynuayex' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dynamically populate frontend .env from PROD secret so NO secrets or domain URLs are hardcoded in YAML
      - name: Setup Frontend Environment from Secret
        run: |
          if [ -n "$PROD_FRONTEND_ENV" ]; then
            echo "$PROD_FRONTEND_ENV" > ./frontend/.env
          fi

          if [ -f ./frontend/.env ]; then
            echo "Loading build-args from ./frontend/.env..."
            while IFS='=' read -r key value || [ -n "$key" ]; do
              key=$(echo "$key" | tr -d '\r' | xargs)
              value=$(echo "$value" | tr -d '\r' | xargs)
              if [[ -n "$key" && ! "$key" =~ ^# ]]; then
                echo "$key=$value" >> $GITHUB_ENV
              fi
            done < ./frontend/.env
          fi
        env:
          PROD_FRONTEND_ENV: ${{ secrets.PROD_FRONTEND_ENV_FILE }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          pull: true
          no-cache: true
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_ENTRA_CLIENT_ID=${{ env.NEXT_PUBLIC_ENTRA_CLIENT_ID }}
            NEXT_PUBLIC_ENTRA_TENANT_ID=${{ env.NEXT_PUBLIC_ENTRA_TENANT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-mpxj:
    name: Build & Push MPXJ Service (Cloud Runner)
    if: ${{ github.event.inputs.deploy_mpxj == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      image_mpxj: ${{ steps.meta.outputs.mpxj_image }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Resolve MPXJ Image Tags
        id: meta
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME || 'aynuayex' }}"
          REPO="${DOCKER_USER}/cybersec-pmo"
          
          IMAGE_TAG="mpxj-service-${COMMIT_SHA}"
          MPXJ_IMMUTABLE="${REPO}:${IMAGE_TAG}"
          MPXJ_LATEST="${REPO}:mpxj-service"
          
          echo "mpxj_image=$MPXJ_IMMUTABLE" >> $GITHUB_OUTPUT
          echo "mpxj_tags=${MPXJ_IMMUTABLE},${MPXJ_LATEST}" >> $GITHUB_OUTPUT
          echo "Resolved MPXJ Tags: ${MPXJ_IMMUTABLE}, ${MPXJ_LATEST}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'aynuayex' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push MPXJ Service Image
        uses: docker/build-push-action@v5
        with:
          pull: true
          no-cache: true
          context: ./mpxj-service
          file: ./mpxj-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.mpxj_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Deploy to Production VPS
    needs: [build-backend, build-frontend, build-mpxj]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GIT_REF: ${{ github.event.inputs.git_ref }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME || 'aynuayex' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PROD_BACKEND_ENV: ${{ secrets.PROD_BACKEND_ENV_FILE }}
          PROD_FRONTEND_ENV: ${{ secrets.PROD_FRONTEND_ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GIT_REF,DOCKERHUB_USER,DOCKERHUB_TOKEN,PROD_BACKEND_ENV,PROD_FRONTEND_ENV
          command_timeout: 15m
          script: |
            set -e
            echo "🚀 Starting Production Deployment on VPS (/var/www/cybsec-pmo)..."
            cd /var/www/cybsec-pmo

            # 1. Login to Docker Hub on VPS to pull private images
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "Authenticating with Docker Hub on VPS..."
              echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin 2>/dev/null || true
            fi

            # 2. Smart merge backend environment file (backend/.env.prod) if provided
            if [ -n "$PROD_BACKEND_ENV" ]; then
              echo "Syncing and merging backend environment into backend/.env.prod..."
              STAGE_ENV="$PROD_BACKEND_ENV" node -e '
                const fs = require("fs");
                const path = "./backend/.env.prod";
                const incoming = process.env.STAGE_ENV || "";
                let lines = fs.existsSync(path) ? fs.readFileSync(path, "utf8").split(/\r?\n/) : [];
                const incomingEntries = incoming.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith("#") && l.includes("="));
                const incomingMap = new Map();
                for (const entry of incomingEntries) {
                  const idx = entry.indexOf("=");
                  const key = entry.slice(0, idx).trim();
                  const val = entry.slice(idx + 1);
                  if (key) incomingMap.set(key, val);
                }
                const updatedKeys = new Set();
                const newLines = lines.map(line => {
                  const trimmed = line.trim();
                  if (!trimmed || trimmed.startsWith("#") || !trimmed.includes("=")) return line;
                  const idx = trimmed.indexOf("=");
                  const key = trimmed.slice(0, idx).trim();
                  if (incomingMap.has(key)) {
                    updatedKeys.add(key);
                    return `${key}=${incomingMap.get(key)}`;
                  }
                  return line;
                });
                for (const [key, val] of incomingMap.entries()) {
                  if (!updatedKeys.has(key)) newLines.push(`${key}=${val}`);
                }
                try {
                  fs.mkdirSync("./backend", { recursive: true });
                  fs.writeFileSync(path, newLines.join("\n").trim() + "\n", { mode: 0o600 });
                  console.log("Successfully merged " + incomingMap.size + " backend environment variables into " + path);
                } catch (err) {
                  console.warn("Notice: Could not write to " + path + " (" + err.message + "). Proceeding with existing manual server file.");
                }
              '
            fi

            # 3. Smart merge frontend environment file (frontend/.env) if provided
            if [ -n "$PROD_FRONTEND_ENV" ]; then
              echo "Syncing and merging frontend environment into frontend/.env..."
              STAGE_ENV="$PROD_FRONTEND_ENV" node -e '
                const fs = require("fs");
                const path = "./frontend/.env";
                const incoming = process.env.STAGE_ENV || "";
                let lines = fs.existsSync(path) ? fs.readFileSync(path, "utf8").split(/\r?\n/) : [];
                const incomingEntries = incoming.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith("#") && l.includes("="));
                const incomingMap = new Map();
                for (const entry of incomingEntries) {
                  const idx = entry.indexOf("=");
                  const key = entry.slice(0, idx).trim();
                  const val = entry.slice(idx + 1);
                  if (key) incomingMap.set(key, val);
                }
                const updatedKeys = new Set();
                const newLines = lines.map(line => {
                  const trimmed = line.trim();
                  if (!trimmed || trimmed.startsWith("#") || !trimmed.includes("=")) return line;
                  const idx = trimmed.indexOf("=");
                  const key = trimmed.slice(0, idx).trim();
                  if (incomingMap.has(key)) {
                    updatedKeys.add(key);
                    return `${key}=${incomingMap.get(key)}`;
                  }
                  return line;
                });
                for (const [key, val] of incomingMap.entries()) {
                  if (!updatedKeys.has(key)) newLines.push(`${key}=${val}`);
                }
                try {
                  fs.mkdirSync("./frontend", { recursive: true });
                  fs.writeFileSync(path, newLines.join("\n").trim() + "\n", { mode: 0o600 });
                  console.log("Successfully merged " + incomingMap.size + " frontend environment variables into " + path);
                } catch (err) {
                  console.warn("Notice: Could not write to " + path + " (" + err.message + "). Proceeding with existing manual server file.");
                }
              '
            fi

            # 5. Pull latest Docker Hub images
            echo "Pulling latest production images from Docker Hub..."
            docker compose -f docker-compose.prod.yml pull

            # 6. Recreate & start containers with zero downtime
            echo "Restarting production containers..."
            docker compose -f docker-compose.prod.yml up -d

            # 7. Verify running containers
            echo "Production container status:"
            docker compose -f docker-compose.prod.yml ps

            # 8. Clean up unused images to preserve VPS disk space
            echo "Pruning dangling images..."
            docker image prune -f

            echo "🎉 Production deployment successfully completed!"
